- code: "INEN 5301-05"
  name: "Collaborative Robot Operations and Programming"
  semesters:
    - "Fall 2024"
    - "Fall 2025"
  description: >
    This hands-on course covers fundamental concepts of industrial robotics, including
    kinematics, programming, and collaborative robot operations. Students gain practical
    experience programming a real UR10e cobot using PolyScope X interface under guidance
    from certified trainers. Through realistic lab scenarios, you will develop skills in
    robot task automation, learn to create and optimize robot programs, and master the
    unique features of PolyScope X for manufacturing applications. Upon completion,
    students earn the "Educational Robotics Training - Core" certification. See the
    [UR Academy Brochure](https://academy.universal-robots.com/media/g52jayc3/ur-academy-brochure-training-eng-may-2026.pdf)
    for certification details.
  syllabus: "files/ST_Collab._Robot_Ops_and_Pro_INEN_5301_Fall_2025.pdf"
  textbooks:
    - title: "Robotics: Modelling, Planning and Control by Siciliano, Bruno"
      url: "https://people.disim.univaq.it/~costanzo.manes/EDU_stuff/Robotics_Modelling,%20Planning%20and%20Control_Sciavicco_extract.pdf"
    - title: "User manual - UR10e e-Series"
      url: "https://www.universal-robots.com/download/manuals-e-seriesur20ur30/user/ur10e/512/user-manual-ur10e-e-series-sw-512-english-international-en/"
    - title: "Industrial Robotics Control"
      url: "https://link.springer.com/book/10.1007/978-1-4842-8989-1"
    - title: "Robotics and Automation Handbook"
      url: "https://dl.icdst.org/pdfs/files/5bc4ddc0b1b8f7e5738d8440fe191904.pdf"
  projects: []
  links:
    - title: "Universal Robots Academy Free e-Learning Courses"
      url: "https://academy.universal-robots.com/free-e-learning/"

- code: "INEN 5301-01"
  name: "AR/VR in Manufacturing"
  semesters:
    - "Spring 2025" 
    - "Spring 2026" 
  description: >
    Explores the application of Augmented Reality and Virtual Reality technologies
    in modern manufacturing systems. Topics include AR/VR hardware platforms,
    spatial computing, human-machine interaction, and industrial use cases such as
    remote assistance, digital twins, and operator training.
  syllabus: "files/files files/ST_AR_VR_in_Manufacturing_INEN_5301_Spring_2026.pdf"
  textbooks: []
  projects: 
    - title: "Development of an Interactive AR-Based Educational Application for Demonstrating Newton's Cradle Motion"
      url: "/research/#development-of-an-interactive-ar-based-educational-application-for-demonstrating-newton-s-cradle-motion"

- code: "INEN 5358"
  name: "Introduction to Robotics"
  semesters:
    - "Spring 2025"
  description: >
    An introductory course on robotics covering robot anatomy, coordinate frames,
    forward and inverse kinematics, trajectory planning, and basic control. Designed
    for graduate students with an engineering or computer science background.
  syllabus: "Intro_Robotics_INEN_5358_Spring_2025.pdf"
  textbooks: 
    - title: "Introduction to Robotics: Mechanics and Control"
      url: "https://www.changjiangcai.com/files/text-books/Introduction-to-Robotics-3rd-edition.pdf"
  projects: []

- code: "INEN 6110"
  name: "Professional Seminar"

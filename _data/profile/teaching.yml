  projects: []

- code: "INEN 6301"
  name: "Advanced Robotics"
  semesters:
    - "Fall 2026"
  description: >
    A doctoral-level special topics course that extends the collaborative robotics
    curriculum of INEN 5301 to analytical and research depth. Building on hands-on
    UR10e operation, the course develops homogeneous transformations and DH forward
    kinematics, analytical inverse kinematics and the Jacobian, robot dynamics with
    impedance and force control, closed-loop control derivation and PID tuning,
    hand-eye calibration for vision-guided manipulation, and optimization-based robot
    cell design. Students also survey current research in human-robot collaboration,
    complete a literature review, and carry out an original UR10-based research project
    written and presented in conference-paper format.
  syllabus: ""
  textbooks:
    - title: "Robotics: Modelling, Planning and Control by Siciliano, Bruno"
      url: "https://people.disim.univaq.it/~costanzo.manes/EDU_stuff/Robotics_Modelling,%20Planning%20and%20Control_Sciavicco_extract.pdf"
    - title: "User manual - UR10e e-Series"
      url: "https://www.universal-robots.com/download/manuals-e-seriesur20ur30/user/ur10e/512/user-manual-ur10e-e-series-sw-512-english-international-en/"
  projects: []


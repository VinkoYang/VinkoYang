- code: "INEN 4375"
  name: "Simulation of Industrial Engineering Systems"
  semesters:
    - "Fall 2026"
  description: >
    An introduction to discrete-event simulation as a modeling and decision-support
    tool for industrial engineering systems that are too complex for closed-form
    analytical methods. The course covers the nine-step simulation study methodology,
    queueing theory fundamentals (Kendall notation, Little's Law, M/M/1, M/M/c, M/G/1),
    pseudo-random number generation and random variate generation by inverse transform,
    hand-computed spreadsheet simulation of a queue, and model building, verification,
    validation, and statistical output analysis in Arena. Students complete an original
    simulation project as a capstone deliverable.
  syllabus: ""
  textbooks:
    - title: "Simulation with Arena by Kelton, Sadowski & Zupick"
      url: "https://www.mheducation.com/highered/product/simulation-with-arena-kelton.html?viewOption=student"
  projects: []

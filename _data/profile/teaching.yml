- code: "INEN 5358"
  name: "Introduction to Robotics"
  semesters:
    - "Spring 2025"
  description: >
    An introductory course on robotics covering robot anatomy, coordinate frames,
    forward and inverse kinematics, trajectory planning, and basic control. Designed
    for graduate students with an engineering or computer science background.
  syllabus: "files/teaching/Intro_Robotics_INEN_5358_Spring_2025.pdf"
  textbooks: 
    - title: "Introduction to Robotics: Mechanics and Control"

# =============================================================================
# people.yml — Single source of truth for all lab members
# =============================================================================
# Sections: pi | collaborators | students | alumni | other
#
# Pages that consume this file:
#   _pages/about.md    → people.pi, people.students (show_about: true)
#   _pages/team.md     → people.pi, people.students (show_team: true),
#                         people.alumni, people.collaborators
#   _pages/research.md → auto-links author/mentor names to their website
# =============================================================================


# -----------------------------------------------------------------------------
# PI
# Used in: about.md (education list), team.md (PI card), research.md (author link)
# Fields:
#   website        – canonical URL linked from research page author credits
#   education      – full degree list shown in about.md / team.md
#   educationshort – condensed list shown in sidebar
# -----------------------------------------------------------------------------
pi:
  website: "https://wenhaoyang.com/about/"
  education:
    - "2023 - Ph.D. Rochester Institute of Technology"
    - "2019 - M.S. The Hong Kong University of Science and Technology"
    - "2018 - B.S. Nanjing University of Aeronautics and Astronautics"
  educationshort:
    - "2023 - Ph.D. Rochester Institute of Technology"
    - "2019 - M.S. The Hong Kong University of Science and Technology"
    - "2018 - B.S. Nanjing University of Aeronautics and Astronautics"



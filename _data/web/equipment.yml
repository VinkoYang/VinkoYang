    - name: "Academy Hardware Set"
      maker: "Universal Robots"
      description: >
        UR's training kit for classrooms and labs, built to work with any UR cobot.
        Ours is a beech multiplex panel with conveyor belts, an I/O simulator, and presence sensors that detect when a part is in position.
        Students use it to practice pick and place, palletizing, dispensing, force control, and multi-end-effector tasks, and to wire and program the peripherals a real cell depends on.
      specs:
        - "Beech multiplex panel with conveyor belts and an I/O simulator"
        - "Presence sensors wired to the robot's digital inputs"
        - "Simulates pick and place, palletizing, dispensing, force control, and multi-end-effector work"
      links:
        - label: "UR Marketplace"
          url: "https://www.universal-robots.com/marketplace/products/01tP400000ApevJIAR/"
          note: "Overview and features of the set"
        - label: "Conveyor tracking setup video"
          url: "https://www.youtube.com/watch?v=JCcuciZi7ws"
          note: "Setting up conveyor tracking on a UR10e"
        - label: "Conveyor tracking guide"
          url: "https://www.universal-robots.com/articles/ur/application-installation/conveyor-tracking-with-wizard/"
          note: "UR's step-by-step article on the conveyor tracking wizard"


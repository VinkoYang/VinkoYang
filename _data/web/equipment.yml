      specs:
        - "Torque: 0.5–4 Nm"
        - "Screws: M2.5–M5, 4–25 mm long, any material"
        - "Vacuum air supply: 100 psi"
        - "URCap: Robotiq_Screwdriving (PolyScope 5.9.4 or later on e-Series)"

- title: "AI Identification and Mapping of Invasive Aquatic Plants"
  image: "research/2026_plantIdentifier.jpg"
  focus: [1]
  start_date: "2025-9"
  end_date: "2026-5"
  authors:
    - name: "Lucas Parker"

- title: "Seeing Isn't Believing: The Vertical-Horizontal Illusion Across Screens and XR Headsets"
  image: "research/2026_Vertical-HorizontalIllusion.png"
  start_date: "2026-2"
  end_date: "2026-3"
  authors:
    - name: "Wenhao Yang"
    - name: "Yueqing Li"
    - name: "Xinyu Liu"
  keywords:
    - Mixed Reality
    - Head-Mounted Displays
    - Human Computer Interaction 
    - Spatial Perception
  abstract: >
    The Vertical-Horizontal Illusion (VHI) biases perceived geometric proportions across visual displays. 
    This study introduces the Square Recognition Test (SRT), a unified method to measure perceived squareness across devices. 
    A within-subject study (N = 24) on PC, mobile, and AR HMDs shows a consistent bias toward slightly wider-than-tall rectangles 
    (PSE ≈ 1.02-1.04), indicating device-invariant VHI effects. 
  links:
    paper: ""
    webpage: ""
    video: ""
    bib: ""


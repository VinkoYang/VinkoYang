    - Interactive Learning
    - Human-Computer Interaction
    - Unity Engine
  abstract: >
    This project presents the development of an interactive augmented reality (AR) application designed to demonstrate the 
    motion of a Newton's cradle for educational purposes. With the increasing use of mobile devices among children, the 
    application aims to leverage AR technology to provide an engaging and accessible platform for learning fundamental physics 

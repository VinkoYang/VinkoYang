# ============================================================
# STEP 3: Site Settings
# ============================================================
# Brand color for non-CSS assets only (favicon.svg), which can't read CSS
# variables. The site's actual accent colors are a four-rung scale
# (wash/soft/base/deep) with separate light and dark values — too much for one
# key — and live in _sass/base/_variables.scss. Keep this in sync with the
# --accent rung there.
accent_color: "#2196F3"
dark_mode: true              # show dark mode toggle in navbar
description: "Academic webpage of Dr. Wenhao Yang"
baseurl: ""
url: "https://wenhaoyang.com"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: "G-7VDC03WDXT"

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: talks
  - name: research
  - name: lab
  - name: team
  - name: teaching
  - name: videos
  - name: blogs

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

permalink: /blogs/:title/

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Yang
  first_name: [Wenhao]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - cv          # CV markdown source; rendered to files/cv.pdf by CI
  - package.json
  - package-lock.json
  - docs

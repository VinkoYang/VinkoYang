<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    {% include header.html %}

    {% if page.hero_image %}
    <div class="page-hero">
      <img src="{{ site.url }}{{ site.baseurl }}/{{ page.hero_image }}" alt="{{ page.title }}" loading="eager">
    </div>
    {% endif %}

    <main class="site-container">
      {{ content }}
    </main>

    {% include footer.html %}

  </body>

</html>
